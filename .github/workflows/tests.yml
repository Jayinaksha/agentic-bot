# Unit tests and design checks for the v2 stack.
#
# Deliberately does NOT install ROS 2 or Gazebo. Everything here runs on a plain
# Python interpreter in seconds, which is the whole reason the geometry and
# control maths were kept in ROS-free modules: the logic that decides whether the
# robot climbs or falls down the stairs gets checked on every push, without
# waiting twenty minutes for a container that still could not run Gazebo
# headless in a useful way.
#
# Simulation and hardware bring-up stay manual - see
# docs/ARCHITECTURE_V2.md#suggested-bring-up-order.

name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is ROS 2 Jazzy's interpreter, which this stack targets. 3.10 is
        # kept because the ROS-free maths modules should stay portable - but
        # note the Nav2 CONFIG is Jazzy-only (see check_nav2_plugins.py), so a
        # green 3.10 run here does not imply the stack runs on Humble.
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: run unit tests
        run: |
          python -m pytest -q \
            src/r2d2_locomotion/test \
            src/r2d2_navigation/test \
            src/r2d2_memory/test \
            src/r2d2_perception/test \
            src/r2d2_mcp/test \
            src/r2d2_sim/test

  design-checks:
    name: design checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip pyyaml

      # Fails the build if the platform can no longer climb the staircase it is
      # specified against - reach, tread fit, tipping, torque, ride height.
      - name: tri-star climb envelope
        run: python scripts/analyse_climb.py

      # The world generator refuses to emit stairs the robot cannot mount, so
      # this also proves robot and test world are still in step.
      - name: regenerate the house world
        run: |
          python src/r2d2_sim/worlds/generate_house.py --out /tmp/house.sdf
          python - <<'EOF'
          import xml.dom.minidom as minidom
          doc = minidom.parse('/tmp/house.sdf')
          models = doc.getElementsByTagName('model')
          assert len(models) > 40, f'only {len(models)} models in the world'
          print(f'world parses: {len(models)} models')
          EOF

      # The generator writes two files: the world, and the floor graph the
      # navigation layer plans staircase routes against. Both must be in step
      # with robot_params.yaml, or the robot drives to a flight that has moved.
      - name: committed world and floor graph match the generator
        run: |
          python src/r2d2_sim/worlds/generate_house.py \
            --out /tmp/regen.sdf --floors-out /tmp/regen_floors.yaml
          stale=0
          if ! diff -q src/r2d2_sim/worlds/house_two_floor.sdf /tmp/regen.sdf; then
            echo "::error::house_two_floor.sdf is stale."
            diff -u src/r2d2_sim/worlds/house_two_floor.sdf /tmp/regen.sdf | head -40
            stale=1
          fi
          if ! diff -q src/r2d2_localization/config/floors.yaml /tmp/regen_floors.yaml; then
            echo "::error::floors.yaml is stale."
            diff -u src/r2d2_localization/config/floors.yaml /tmp/regen_floors.yaml | head -20
            stale=1
          fi
          if [ "$stale" = "1" ]; then
            echo "Regenerate both: python3 src/r2d2_sim/worlds/generate_house.py"
            exit 1
          fi
          echo "committed world and floor graph are up to date"

      # The staircase must be reachable: the robot squares up by yawing on the
      # spot, so it needs its own length plus turning room clear of the bottom
      # step, and the transition poses must not sit on the flight or in the
      # stairwell opening.
      # The robot must fit through the house it is asked to navigate. This is
      # the same arithmetic that caught a staircase with 0.20 m of approach room
      # for a 0.36 m robot, applied to the doorways and the costmap tuning.
      - name: the robot fits through its own doorways
        run: python scripts/check_clearances.py

      - name: staircase is approachable and its poses are on solid floor
        run: |
          python - <<'EOF'
          import sys, yaml
          sys.path.insert(0, 'src/r2d2_sim/worlds')
          from generate_house import (MIN_APPROACH_CLEARANCE, STAIR_X0,
                                      floor_transitions)

          cfg = yaml.safe_load(
              open('src/r2d2_description/config/robot_params.yaml'))
          body = cfg['platform']['body_length']
          flight = cfg['stairs']['steps'] * cfg['stairs']['tread']
          t = floor_transitions(cfg)[0]
          problems = []

          if STAIR_X0 < MIN_APPROACH_CLEARANCE:
              problems.append(
                  f'only {STAIR_X0} m of floor west of the bottom step')
          gap = STAIR_X0 - t['foot']['x']
          if gap <= body / 2:
              problems.append(
                  f'the foot pose is {gap:.2f} m from the bottom step, inside '
                  f'the {body / 2:.2f} m half-length of the robot')
          if t['head']['x'] <= STAIR_X0 + flight:
              problems.append(
                  f'the head pose x={t["head"]["x"]} is inside the stairwell '
                  f'opening, which ends at x={STAIR_X0 + flight:.2f}')

          for problem in problems:
              print(f'::error::{problem}')
          print(f'foot {t["foot"]}, head {t["head"]}, '
                f'{gap:.2f} m of approach clearance')
          sys.exit(1 if problems else 0)
          EOF

  # The MCP layer is the one part of this stack with a third-party API that
  # moves underneath it. The SDK renamed FastMCP to MCPServer and moved several
  # fields to snake_case in 2.0, which broke the server at import and, more
  # quietly, stripped the argument schemas off every tool. Installing the real
  # SDK and loading the server is the only check that catches that.
  mcp-sdk:
    name: MCP server loads against the real SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install the MCP SDK
        run: python -m pip install --upgrade pip "mcp>=2,<3" httpx pyyaml

      - name: the server registers every tool with an intact schema
        env:
          PYTHONPATH: src/r2d2_mcp:src/r2d2_memory:src/r2d2_navigation
        run: |
          python - <<'EOF'
          import asyncio, sys

          # Import the SDK explicitly first. server.py degrades gracefully when
          # it is absent - mcp becomes None - so without this the step fails
          # with an opaque AttributeError instead of saying the install did not
          # take.
          import mcp  # noqa: F401

          import r2d2_mcp.server as server
          from r2d2_mcp.llm import mcp_tools_to_openai

          # Tools that genuinely take no arguments.
          NO_ARGS = {'get_state', 'climb_stairs', 'stop', 'reset_safety_stop'}

          if server.mcp is None:
              print('::error::the MCP SDK imported but the server did not '
                    'construct; its API has probably changed again')
              sys.exit(1)

          async def main():
              tools = await server.mcp.list_tools()
              if not tools:
                  print('::error::the server registered no tools at all')
                  return 1
              converted = mcp_tools_to_openai(tools)
              stripped = [c['function']['name'] for c in converted
                          if not c['function']['parameters'].get('properties')
                          and c['function']['name'] not in NO_ARGS]
              for name in stripped:
                  print(f'::error::{name} was advertised to the model with no '
                        f'arguments; its schema was lost in conversion')
              print(f'{len(tools)} tools registered on MCP SDK '
                    f'{server._SDK_MAJOR}.x, schemas intact')
              return 1 if stripped else 0

          sys.exit(asyncio.run(main()))
          EOF

  static:
    name: parse and wiring checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip pyyaml

      # py_compile checks syntax and nothing else: a NameError from a missing
      # import sails straight through it, and would only surface when that line
      # runs on a robot. pyflakes resolves names. Scoped to the v2 packages -
      # the v1 code has pre-existing findings that are not this branch's to churn.
      - name: no undefined names or dead imports in the v2 code
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes $(find src/r2d2_description src/r2d2_sim \
            src/r2d2_locomotion src/r2d2_localization src/r2d2_navigation \
            src/r2d2_perception src/r2d2_memory src/r2d2_mcp scripts \
            -name '*.py')

      # The URDF is the foundation everything else spawns from. Parsing its XML
      # says nothing about whether xacro can expand it - an undefined property or
      # a macro signature mismatch fails only when xacro actually runs.
      - name: the robot description processes through xacro
        run: |
          python -m pip install --quiet xacro
          mkdir -p /tmp/stubs/ament_index_python
          touch /tmp/stubs/ament_index_python/__init__.py
          cat > /tmp/stubs/ament_index_python/packages.py <<'STUB'
          import os
          ROOT = os.path.join(os.getcwd(), 'src')
          class PackageNotFoundError(Exception):
              pass
          def get_package_share_directory(name):
              path = os.path.join(ROOT, name)
              if not os.path.isdir(path):
                  raise PackageNotFoundError(name)
              return path
          def get_package_prefix(name):
              return get_package_share_directory(name)
          STUB
          PYTHONPATH=/tmp/stubs python - <<'EOF'
          import sys, xml.dom.minidom as minidom, yaml, xacro

          doc = xacro.process_file('src/r2d2_description/urdf/r2d2_tristar.urdf.xacro',
                                   mappings={'use_sim': 'true'})
          open('/tmp/robot.urdf', 'w').write(doc.toprettyxml(indent='  '))
          parsed = minidom.parse('/tmp/robot.urdf')

          joints = {j.getAttribute('name') for j in parsed.getElementsByTagName('joint')}
          links = {l.getAttribute('name') for l in parsed.getElementsByTagName('link')}
          problems = []

          # The controller commands joints by name; a mismatch is silent.
          controllers = yaml.safe_load(open('src/r2d2_locomotion/config/controllers.yaml'))
          declared = controllers['tristar_velocity_controller']['ros__parameters']['joints']
          missing = [j for j in declared if j not in joints]
          if missing:
              problems.append(f'controllers.yaml names joints absent from the URDF: {missing}')

          block = parsed.getElementsByTagName('ros2_control')
          listed = {j.getAttribute('name') for j in block[0].getElementsByTagName('joint')} if block else set()
          if listed != set(declared):
              problems.append(f'ros2_control and controllers.yaml disagree: {listed ^ set(declared)}')

          children = {j.getElementsByTagName('child')[0].getAttribute('link')
                      for j in parsed.getElementsByTagName('joint')
                      if j.getElementsByTagName('child')}
          roots = links - children
          if len(roots) != 1:
              problems.append(f'the kinematic tree has {len(roots)} roots: {sorted(roots)}')

          for frame in ('laser', 'imu_link', 'camera_link',
                        'tof_fl', 'tof_fr', 'tof_rl', 'tof_rr', 'tail_link'):
              if frame not in links:
                  problems.append(f'sensor frame {frame} is missing')

          for link in parsed.getElementsByTagName('link'):
              inertial = link.getElementsByTagName('inertial')
              if not inertial:
                  continue
              mass = float(inertial[0].getElementsByTagName('mass')[0].getAttribute('value'))
              inertia = inertial[0].getElementsByTagName('inertia')[0]
              if mass <= 0 or any(float(inertia.getAttribute(k)) <= 0
                                  for k in ('ixx', 'iyy', 'izz')):
                  problems.append(f'{link.getAttribute("name")} has non-positive mass or inertia')

          for problem in problems:
              print(f'::error::{problem}')
          print(f'URDF expands: {len(links)} links, {len(joints)} joints, '
                f'{len(declared)} controlled joints all present')
          sys.exit(1 if problems else 0)
          EOF

      - name: every v2 file parses
        run: |
          python - <<'EOF'
          import glob, sys, xml.dom.minidom as minidom, yaml, py_compile

          failures = []
          for pattern in ('src/r2d2_*/**/*.xml', 'src/r2d2_*/**/*.xacro',
                          'src/r2d2_*/**/*.sdf'):
              for path in glob.glob(pattern, recursive=True):
                  try:
                      minidom.parse(path)
                  except Exception as exc:
                      failures.append((path, exc))

          for pattern in ('src/r2d2_*/**/*.yaml', 'src/r2d2_*/**/*.yml'):
              for path in glob.glob(pattern, recursive=True):
                  try:
                      yaml.safe_load(open(path))
                  except Exception as exc:
                      failures.append((path, exc))

          for pattern in ('src/r2d2_*/**/*.py', 'scripts/*.py'):
              for path in glob.glob(pattern, recursive=True):
                  try:
                      py_compile.compile(path, doraise=True)
                  except Exception as exc:
                      failures.append((path, exc))

          for path, exc in failures:
              print(f'::error file={path}::{exc}')
          sys.exit(1 if failures else 0)
          EOF

      - name: setup.py entry points resolve
        run: |
          python - <<'EOF'
          import glob, os, re, sys
          missing = []
          for setup in glob.glob('src/r2d2_*/setup.py'):
              package = os.path.dirname(setup)
              for line in open(setup):
                  match = re.search(r"'\w+ = ([\w.]+):main'", line)
                  if match:
                      module = match.group(1).replace('.', '/') + '.py'
                      if not os.path.exists(os.path.join(package, module)):
                          missing.append((setup, match.group(1)))
          for setup, module in missing:
              print(f'::error file={setup}::entry point {module} has no module')
          sys.exit(1 if missing else 0)
          EOF

      # Two writers on one command topic is the failure mode that silently
      # breaks a ROS stack, and it is exactly what a launch file will not tell
      # you. The climb FSM must be the sole authority over the wheels, or
      # something can take the platform away from it mid-staircase.
      - name: single writer on the safety-critical topics
        run: |
          python - <<'EOF'
          import collections, glob, re, sys

          publishers = collections.defaultdict(set)
          for path in glob.glob('src/r2d2_*/r2d2_*/*.py'):
              node = path.split('/')[-1][:-3]
              for match in re.finditer(r"create_publisher\(\s*\w+,\s*'([^']+)'",
                                       open(path).read()):
                  publishers[match.group(1)].add(node)

          ok = True
          for topic in ('/cmd_vel', '/locomotion/mode'):
              writers = sorted(publishers.get(topic, []))
              if writers != ['climb_fsm']:
                  print(f'::error::{topic} must be written only by climb_fsm, '
                        f'found {writers or "no writers"}')
                  ok = False
              else:
                  print(f'{topic}: single writer (climb_fsm)')
          sys.exit(0 if ok else 1)
          EOF

      # A misspelled ROS 2 parameter fails silently: the node runs on its
      # hard-coded default and the value you tuned is ignored.
      - name: parameters match the nodes they configure
        run: python scripts/check_params.py

      # Nav2 standardised plugin naming on "::" in Jazzy; Humble and Iron use
      # "/". The names are not aliased, so a wrongly-styled plugin does not warn,
      # it fails to load. A half-finished migration is worst: some plugins load,
      # some do not, and the stack limps in a way that looks like bad tuning.
      # A config file can exist in src/, be referenced correctly, and still be
      # missing at run time because setup.py never installed it. Likewise an
      # executable name: the launch file asked for laser_scan_matcher_node while
      # the CMakeLists installs laser_scan_matcher, and only building it would
      # have shown that.
      # The memory layer's queries are written by hand against ~60 columns. A
      # misspelled one fails on the first query that touches it, in a robot that
      # has been driving happily for ten minutes. pglast is the real PostgreSQL
      # grammar, so this needs no database.
      - name: SQL matches the schema it queries
        run: |
          python -m pip install --quiet pglast
          python scripts/check_sql.py

      - name: launch and xacro references resolve after install
        run: python scripts/check_launch.py

      - name: Nav2 plugin names are consistently styled
        run: python scripts/check_nav2_plugins.py

      - name: referenced scripts exist
        run: |
          python - <<'EOF'
          import glob, os, re, sys
          referenced = set()
          for pattern in ('src/**/*.py', 'src/**/*.yaml', 'docs/*.md'):
              for path in glob.glob(pattern, recursive=True):
                  try:
                      text = open(path, encoding='utf-8').read()
                  except (UnicodeDecodeError, OSError):
                      continue
                  referenced.update(re.findall(r'scripts/[a-z_]+\.py', text))
          missing = sorted(s for s in referenced if not os.path.exists(s))
          for script in missing:
              print(f'::error::{script} is referenced but does not exist')
          print(f'{len(referenced) - len(missing)}/{len(referenced)} referenced '
                f'scripts exist')
          sys.exit(1 if missing else 0)
          EOF
