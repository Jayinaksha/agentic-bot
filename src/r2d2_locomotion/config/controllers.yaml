# ros2_control configuration loaded by gz_ros2_control inside Gazebo.
#
# There is deliberately no diff_drive_controller here. A diff drive controller
# assumes one rigid wheel radius, which is only true in ROLLING mode; the moment
# a cluster tumbles, its effective radius becomes the cluster circumradius and
# the controller's odometry silently lies. Instead we expose raw joint velocity
# interfaces and let r2d2_locomotion/tristar_controller.py own both the
# kinematics and the mode-aware odometry.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    tristar_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

tristar_velocity_controller:
  ros__parameters:
    use_sim_time: true
    # Order matters: tristar_controller.py builds its command vector in exactly
    # this order. Keep the four clusters grouped, carrier first within a cluster.
    joints:
      - front_left_carrier_joint
      - front_left_wheel0_joint
      - front_left_wheel1_joint
      - front_left_wheel2_joint
      - front_right_carrier_joint
      - front_right_wheel0_joint
      - front_right_wheel1_joint
      - front_right_wheel2_joint
      - rear_left_carrier_joint
      - rear_left_wheel0_joint
      - rear_left_wheel1_joint
      - rear_left_wheel2_joint
      - rear_right_carrier_joint
      - rear_right_wheel0_joint
      - rear_right_wheel1_joint
      - rear_right_wheel2_joint
