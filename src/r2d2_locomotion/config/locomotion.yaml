tristar_controller:
  ros__parameters:
    use_sim_time: true
    control_rate: 50.0            # Hz

    # Geometry, mirrored from r2d2_description/config/robot_params.yaml.
    sub_wheel_radius: 0.050
    cluster_circumradius: 0.115
    track_width: 0.340
    wheelbase: 0.260

    # Skid-steer slip factor. A 4-cluster skid-steer does not turn at the ideal
    # differential rate: the lateral scrub of the non-steered clusters eats part
    # of the commanded yaw. 1.0 is the ideal model; measured values for this
    # footprint land near 1.25. Calibrate with scripts/calibrate_slip.py.
    yaw_slip_factor: 1.25

    max_wheel_rate: 12.0          # rad/s
    max_cluster_rate: 3.5         # rad/s
    cmd_timeout: 0.5              # s, zero the outputs if /cmd_vel goes stale

    # Acceleration limits. Tumbling is deliberately gentler: a hard cluster
    # start on a riser flips the platform backwards before the tail loads.
    max_lin_accel_roll: 1.2       # m/s^2
    max_lin_accel_climb: 0.35     # m/s^2

terrain_monitor:
  ros__parameters:
    use_sim_time: true
    rate: 20.0                    # Hz

    # ToF geometry, needed to turn a raw range into a height difference.
    tof_mount_height: 0.180       # m above ground when level (chassis top)
    tof_tilt: 0.5236              # rad below horizontal (30 deg)
    tof_forward_offset: 0.180     # m ahead of base_link

    # Classification thresholds.
    step_up_min: 0.035            # m, below this is a threshold to drive over
    step_up_max: 0.150            # m, above this the cluster cannot mount it
    cliff_drop: 0.060             # m, downward delta that is a fall hazard
    range_valid_max: 1.20         # m, beyond this the beam has missed the floor

    # Attitude limits.
    max_pitch_flat: 0.17          # rad, engage slope mode above this
    max_pitch_climb: 0.70         # rad, hard e-stop
    max_roll: 0.35                # rad, hard e-stop
    attitude_filter_alpha: 0.25   # low-pass on IMU-derived roll/pitch

    # Hazard cloud emitted for the Nav2 obstacle layer.
    hazard_frame: base_link
    hazard_point_height: 0.35     # m, tall enough to register as an obstacle

climb_fsm:
  ros__parameters:
    use_sim_time: true
    rate: 20.0

    # A climb is only entered deliberately: either the navigation stack asks for
    # a floor transition, or both front ToF beams agree on a mountable riser
    # while the robot is driving forward. Spurious entries are expensive - the
    # platform loses wheel odometry for the duration.
    entry_confirm_cycles: 6       # ~0.3 s of agreement before committing
    exit_confirm_cycles: 10       # ~0.5 s of level attitude before declaring done
    approach_speed: 0.10          # m/s, creep onto the first riser
    climb_speed: 0.12             # m/s effective while tumbling
    align_gain: 1.4               # yaw P gain keeping the flight square
    max_align_yaw: 0.35           # rad/s
    climb_timeout: 90.0           # s, abort and back off
    stall_travel_epsilon: 0.02    # m of IMU-integrated rise per 2 s to count as progress
