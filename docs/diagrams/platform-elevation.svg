  <line x1="384.0" y1="263.2" x2="384.0" y2="114.8" stroke="#FF9A52" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="392.0" y="108.8" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#FF9A52" text-anchor="start" font-weight="400" opacity="1.0">reach = r_cluster + r_sub = 165 mm</text>
  <text x="24.0" y="34.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="16" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">PLATFORM, SIDE ELEVATION</text>
  <text x="24.0" y="54.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#828E9B" text-anchor="start" font-weight="400" opacity="1.0">Drawn at the straddle rest phase the controller holds in rolling mode. Filled wheels are in contact.</text>

