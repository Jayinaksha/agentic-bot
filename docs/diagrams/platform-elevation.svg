  <text x="150.0" y="267.2" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#E2E7EC" text-anchor="start" font-weight="400" opacity="1.0"></text>
  <circle cx="384.0" cy="263.2" r="103.5" fill="none" stroke="#38424E" stroke-width="1" stroke-dasharray="3 4"/>
