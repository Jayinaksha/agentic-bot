<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470"
     width="100%" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">Tri-star platform side elevation</title>
  <desc id="d">Chassis 360 by 120 mm on two of four tri-star clusters. Cluster circumradius 115 mm, sub-wheel radius 50 mm, giving a reach of 165 mm. Axle sits 107.5 mm above ground. A Time-of-Flight beam leaves the front face 167.5 mm up, angled 30 degrees down, meeting the floor 290 mm ahead of the sensor.</desc>
