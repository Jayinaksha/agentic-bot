<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470"
     width="100%" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">The velocity command path</title>
  <desc id="d">Nav2 writes to velocity_smoother, then collision_monitor, then cmd_vel_nav. The climb FSM is the sole writer of cmd_vel, which reaches tristar_controller and becomes sixteen joint velocities. precise_docking also writes cmd_vel_nav, and terrain_monitor can stop the FSM.</desc>
  <rect width="880" height="470" fill="#14181D"/>
  <text x="24.0" y="34.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="16" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">THE COMMAND PATH</text>
  <text x="24.0" y="54.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#828E9B" text-anchor="start" font-weight="400" opacity="1.0">One writer to /cmd_vel, enforced in CI. Nothing can take the platform away from the climb FSM mid-staircase.</text>
  <rect x="60" y="100" width="210" height="52" rx="5" fill="#0E1114" stroke="#7FA3B8" stroke-width="1.6"/>
  <text x="72.0" y="122.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">Nav2</text>
  <text x="72.0" y="139.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#7FA3B8" text-anchor="start" font-weight="400" opacity="1.0">controller_server</text>
  <rect x="60" y="170" width="210" height="52" rx="5" fill="#0E1114" stroke="#7FA3B8" stroke-width="1.6"/>
  <text x="72.0" y="192.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">velocity_smoother</text>
  <text x="72.0" y="209.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#7FA3B8" text-anchor="start" font-weight="400" opacity="1.0">/cmd_vel_smoothed</text>
  <rect x="60" y="240" width="210" height="52" rx="5" fill="#0E1114" stroke="#7FA3B8" stroke-width="1.6"/>
  <text x="72.0" y="262.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">collision_monitor</text>
  <text x="72.0" y="279.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#7FA3B8" text-anchor="start" font-weight="400" opacity="1.0">/cmd_vel_nav</text>
  <rect x="330" y="240" width="230" height="52" rx="5" fill="#0E1114" stroke="#FF9A52" stroke-width="1.6"/>
  <text x="342.0" y="262.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">climb_fsm</text>
  <text x="342.0" y="279.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#FF9A52" text-anchor="start" font-weight="400" opacity="1.0">the only writer</text>
  <rect x="620" y="240" width="210" height="52" rx="5" fill="#0E1114" stroke="#E2E7EC" stroke-width="1.6"/>
  <text x="632.0" y="262.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">tristar_controller</text>
  <text x="632.0" y="279.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#E2E7EC" text-anchor="start" font-weight="400" opacity="1.0">/cmd_vel</text>
  <rect x="620" y="340" width="210" height="52" rx="5" fill="#0E1114" stroke="#828E9B" stroke-width="1.6"/>
  <text x="632.0" y="362.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">16 joint velocities</text>
  <text x="632.0" y="379.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#828E9B" text-anchor="start" font-weight="400" opacity="1.0">ros2_control</text>
  <rect x="330" y="100" width="230" height="52" rx="5" fill="#0E1114" stroke="#7FA3B8" stroke-width="1.6"/>
  <text x="342.0" y="122.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">precise_docking</text>
  <text x="342.0" y="139.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#7FA3B8" text-anchor="start" font-weight="400" opacity="1.0">also writes /cmd_vel_nav</text>
  <rect x="330" y="350" width="230" height="52" rx="5" fill="#0E1114" stroke="#C4552A" stroke-width="1.6"/>
  <text x="342.0" y="372.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">terrain_monitor</text>
  <text x="342.0" y="389.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4552A" text-anchor="start" font-weight="400" opacity="1.0">gates via /terrain/estop</text>
  <line x1="165.0" y1="152.0" x2="165.0" y2="170.0" stroke="#38424E" stroke-width="1.6"/>
  <circle cx="165" cy="170" r="3.5" fill="#38424E"/>
  <line x1="165.0" y1="222.0" x2="165.0" y2="240.0" stroke="#38424E" stroke-width="1.6"/>
  <circle cx="165" cy="240" r="3.5" fill="#38424E"/>
  <line x1="270.0" y1="266.0" x2="330.0" y2="266.0" stroke="#38424E" stroke-width="1.6"/>
  <circle cx="330" cy="266" r="3.5" fill="#38424E"/>
  <line x1="560.0" y1="266.0" x2="620.0" y2="266.0" stroke="#38424E" stroke-width="1.6"/>
  <circle cx="620" cy="266" r="3.5" fill="#38424E"/>
  <line x1="725.0" y1="292.0" x2="725.0" y2="340.0" stroke="#38424E" stroke-width="1.6"/>
  <circle cx="725" cy="340" r="3.5" fill="#38424E"/>
  <line x1="445.0" y1="152.0" x2="445.0" y2="240.0" stroke="#7FA3B8" stroke-width="1.6"/>
  <circle cx="445" cy="240" r="3.5" fill="#7FA3B8"/>
  <line x1="445.0" y1="350.0" x2="445.0" y2="292.0" stroke="#C4552A" stroke-width="1.6"/>
  <circle cx="445" cy="292" r="3.5" fill="#C4552A"/>
  <rect x="330" y="205" width="230" height="26" rx="3" fill="#FF9A52" opacity="0.12"/>
  <text x="445.0" y="222.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#FF9A52" text-anchor="middle" font-weight="400" opacity="1.0">gate: passes through, or substitutes</text>
  <text x="24.0" y="450.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#828E9B" text-anchor="start" font-weight="400" opacity="1.0">In IDLE the FSM republishes navigation’s command unchanged. In every other state it substitutes its own and switches the transmission.</text>

</svg>
