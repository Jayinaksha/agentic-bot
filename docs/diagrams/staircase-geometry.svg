<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430"
     width="100%" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">Staircase against the cluster geometry</title>
  <desc id="d">A 150 mm riser with a 280 mm tread. The cluster reach of 165 mm clears the riser by 10 percent. One 120 degree carrier rotation advances 199 mm against a step pitch of 318 mm, a ratio of 0.63, so the cluster does not walk exactly one step per rotation.</desc>
  <rect width="880" height="430" fill="#14181D"/>
  <text x="24.0" y="34.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="16" fill="#E2E7EC" text-anchor="start" font-weight="600" opacity="1.0">THE FLIGHT, AGAINST THE CLUSTER</text>
  <text x="24.0" y="54.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#828E9B" text-anchor="start" font-weight="400" opacity="1.0">First 5 of 12 steps. Every dimension below comes from robot_params.yaml.</text>
  <rect x="90.0" y="267.0" width="173.6" height="93.0" fill="#0E1114" stroke="#38424E" stroke-width="1.5"/>
  <rect x="263.6" y="174.0" width="173.6" height="186.0" fill="#0E1114" stroke="#38424E" stroke-width="1.5"/>
  <rect x="437.2" y="81.0" width="173.6" height="279.0" fill="#0E1114" stroke="#38424E" stroke-width="1.5"/>
  <rect x="610.8" y="-12.0" width="173.6" height="372.0" fill="#0E1114" stroke="#38424E" stroke-width="1.5"/>
  <rect x="784.4" y="-105.0" width="173.6" height="465.0" fill="#0E1114" stroke="#38424E" stroke-width="1.5"/>
  <line x1="20.0" y1="360.0" x2="90.0" y2="360.0" stroke="#38424E" stroke-width="2"/>
  <line x1="52.8" y1="360.0" x2="52.8" y2="267.0" stroke="#828E9B" stroke-width="1"/>
  <circle cx="52.8" cy="360.0" r="2" fill="#828E9B"/>
  <circle cx="52.8" cy="267.0" r="2" fill="#828E9B"/>
  <text x="52.8" y="308.5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#828E9B" text-anchor="middle" font-weight="400" opacity="1.0">riser 150</text>
  <line x1="90.0" y1="251.0" x2="263.6" y2="251.0" stroke="#828E9B" stroke-width="1"/>
  <circle cx="90.0" cy="251.0" r="2" fill="#828E9B"/>
  <circle cx="263.6" cy="251.0" r="2" fill="#828E9B"/>
  <text x="176.8" y="246.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#828E9B" text-anchor="middle" font-weight="400" opacity="1.0">tread 280</text>
  <path d="M 90.0 164.7 A 102.3 102.3 0 0 1 192.3 267.0" fill="none" stroke="#FF9A52" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="102.0" y="156.7" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#FF9A52" text-anchor="start" font-weight="400" opacity="1.0">reach 165 mm > riser 150 mm (10% margin)</text>
  <line x1="90.0" y1="404.0" x2="286.9" y2="404.0" stroke="#828E9B" stroke-width="1"/>
  <text x="294.9" y="408.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#828E9B" text-anchor="start" font-weight="400" opacity="1.0">step pitch 318 mm</text>
  <line x1="90.0" y1="424.0" x2="213.5" y2="424.0" stroke="#C4552A" stroke-width="2.5"/>
  <text x="221.5" y="428.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#C4552A" text-anchor="start" font-weight="400" opacity="1.0">one 120° tumble advances 199 mm (ratio 0.63)</text>
  <text x="24.0" y="414.0" font-family="Saira Condensed, IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#828E9B" text-anchor="start" font-weight="400" opacity="1.0">The cluster does not walk one step per rotation. It still climbs; the gait is lumpy, and Gazebo has to settle whether that matters.</text>

</svg>
